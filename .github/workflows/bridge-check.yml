name: Node Package Tests

on:
  push:
    paths:
      - ".github/workflows/bridge-check.yml"
      - "phodex-bridge/**"
      - "relay/**"
      - "CodexMobile/CodexMobile/**"
  pull_request:
    paths:
      - ".github/workflows/bridge-check.yml"
      - "phodex-bridge/**"
      - "relay/**"
      - "CodexMobile/CodexMobile/**"

jobs:
  bridge-check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Bridge tests
          - os: windows-latest
            name: Native Windows bridge tests
          - os: macos-latest
            name: Native macOS bridge tests
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: phodex-bridge/package-lock.json

      - name: Install bridge dependencies
        working-directory: phodex-bridge
        run: npm ci --ignore-scripts

      - name: Verify bridge entrypoints load
        working-directory: phodex-bridge
        run: |
          node -e "const mod = require('./src'); const names = ['startBridge', 'openLastActiveThread', 'watchThreadRollout']; for (const name of names) { if (typeof mod[name] !== 'function') { throw new Error('Missing export: ' + name); } }"

      - name: Run native transport and service tests
        if: runner.os != 'Linux'
        working-directory: phodex-bridge
        run: >-
          node --test test/codex-transport.test.js test/codex-cli-bootstrap.test.js test/daemon-state.test.js
          test/secure-device-state.test.js test/account-status.test.js test/remodex-cli.test.js
          test/native-service.test.js test/private-state.test.js

      - name: Run macOS launch agent and remote path tests
        if: runner.os == 'macOS'
        working-directory: phodex-bridge
        run: node --test test/macos-launch-agent.test.js test/ios-remote-paths.test.js

      - name: Run complete bridge suite
        if: runner.os == 'Linux'
        working-directory: phodex-bridge
        run: npm test

  relay-check:
    name: Relay tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: relay/package-lock.json

      - name: Install relay dependencies
        working-directory: relay
        run: npm ci --ignore-scripts

      - name: Run relay tests
        working-directory: relay
        run: npm test
